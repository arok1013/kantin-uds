<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Pujasera UDS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f7f9fc;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #4E54C8;
            padding: 15px 50px;
            color: white;
            box-shadow: 0 4px 15px rgba(78, 84, 200, 0.2);
        }

        .navbar-logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .navbar-menu {
            display: flex;
            gap: 20px;
        }

        .navbar-menu a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .navbar-menu a:hover {
            color: #FFD166;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .container.form-container {
            max-width: 450px;
            margin: 80px auto;
            padding: 35px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .form-title {
            text-align: center;
            margin-bottom: 30px;
            color: #4E54C8;
            font-size: 28px;
            position: relative;
            padding-bottom: 10px;
        }

        .form-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #4E54C8, #8F94FB);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #4E54C8;
            box-shadow: 0 0 0 3px rgba(78, 84, 200, 0.2);
            outline: none;
        }

        .invalid-feedback {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .is-invalid {
            border-color: #e74c3c;
        }

        .btn {
            display: inline-block;
            background-color: #4E54C8;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(78, 84, 200, 0.3);
        }

        .btn:hover {
            background-color: #3A40AB;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(78, 84, 200, 0.4);
        }

        .btn-back {
            display: inline-block;
            background-color: #6c757d;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.3);
            text-align: center;
        }

        .btn-back:hover {
            background-color: #5a6268;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(108, 117, 125, 0.4);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .login-link a {
            color: #4E54C8;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: 500;
            display: none;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        footer {
            background-color: #2D3047;
            color: white;
            text-align: center;
            padding: 30px;
            margin-top: 50px;
            width: 100%;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }
            
            .container.form-container {
                margin: 50px 15px;
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-logo">Pujasera UDS</div>
        <div class="navbar-menu">
            <a href="index.html">Beranda</a>
            <a href="login.html">Login</a>
        </div>
    </nav>
    
    <div class="container form-container">
        <h2 class="form-title">Daftar Akun</h2>
        
        <div class="alert alert-success" id="reg-success-alert"></div>
        
        <form id="register-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" class="form-control" placeholder="Masukkan username">
                <span class="invalid-feedback" id="username-err">Silakan masukkan username.</span>
            </div>    
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" class="form-control" placeholder="Masukkan email">
                <span class="invalid-feedback" id="email-err">Silakan masukkan email.</span>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" placeholder="Masukkan password">
                <span class="invalid-feedback" id="password-err">Silakan masukkan password.</span>
            </div>
            <div class="form-group">
                <label>Konfirmasi Password</label>
                <input type="password" id="confirm_password" class="form-control" placeholder="Ulangi password">
                <span class="invalid-feedback" id="confirm-password-err">Silakan konfirmasi password.</span>
            </div>
            <div class="form-group">
                <button type="submit" class="btn">Daftar</button>
            </div>
            <p class="login-link">Sudah punya akun? <a href="login.html">Login disini</a>.</p>
        </form>
        <a href="index.html" class="btn-back">
            <i class="fas fa-arrow-left"></i> Kembali ke Beranda
        </a>
    </div>
    
    <footer>
        <p>&copy; 2025 Derik. Hak Cipta Dilindungi.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if already logged in
            if (localStorage.getItem('loggedin') === 'true') {
                window.location.href = 'index.html';
                return;
            }

            const registerForm = document.getElementById('register-form');
            const usernameInput = document.getElementById('username');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirm_password');

            const usernameErr = document.getElementById('username-err');
            const emailErr = document.getElementById('email-err');
            const passwordErr = document.getElementById('password-err');
            const confirmPasswordErr = document.getElementById('confirm-password-err');
            const successAlert = document.getElementById('reg-success-alert');

            registerForm.addEventListener('submit', function(e) {
                e.preventDefault();

                // Reset validation states
                [usernameInput, emailInput, passwordInput, confirmPasswordInput].forEach(el => el.classList.remove('is-invalid'));
                [usernameErr, emailErr, passwordErr, confirmPasswordErr].forEach(el => el.style.display = 'none');
                successAlert.style.display = 'none';

                const usernameValue = usernameInput.value.trim();
                const emailValue = emailInput.value.trim();
                const passwordValue = passwordInput.value.trim();
                const confirmPasswordValue = confirmPasswordInput.value.trim();

                let hasError = false;

                // Validate username
                if (!usernameValue) {
                    usernameInput.classList.add('is-invalid');
                    usernameErr.textContent = "Silakan masukkan username.";
                    usernameErr.style.display = 'block';
                    hasError = true;
                }

                // Validate email
                if (!emailValue) {
                    emailInput.classList.add('is-invalid');
                    emailErr.textContent = "Silakan masukkan email.";
                    emailErr.style.display = 'block';
                    hasError = true;
                } else if (!validateEmail(emailValue)) {
                    emailInput.classList.add('is-invalid');
                    emailErr.textContent = "Format email tidak valid.";
                    emailErr.style.display = 'block';
                    hasError = true;
                }

                // Validate password
                if (!passwordValue) {
                    passwordInput.classList.add('is-invalid');
                    passwordErr.textContent = "Silakan masukkan password.";
                    passwordErr.style.display = 'block';
                    hasError = true;
                } else if (passwordValue.length < 6) {
                    passwordInput.classList.add('is-invalid');
                    passwordErr.textContent = "Password harus memiliki minimal 6 karakter.";
                    passwordErr.style.display = 'block';
                    hasError = true;
                }

                // Validate confirm password
                if (!confirmPasswordValue) {
                    confirmPasswordInput.classList.add('is-invalid');
                    confirmPasswordErr.textContent = "Silakan konfirmasi password.";
                    confirmPasswordErr.style.display = 'block';
                    hasError = true;
                } else if (passwordValue !== confirmPasswordValue) {
                    confirmPasswordInput.classList.add('is-invalid');
                    confirmPasswordErr.textContent = "Password tidak cocok.";
                    confirmPasswordErr.style.display = 'block';
                    hasError = true;
                }

                if (hasError) return;

                // Get existing users from localStorage
                const users = JSON.parse(localStorage.getItem('users') || '[]');

                // Check duplicate username
                const duplicateUser = users.find(u => u.username.toLowerCase() === usernameValue.toLowerCase());
                if (duplicateUser) {
                    usernameInput.classList.add('is-invalid');
                    usernameErr.textContent = "Username ini sudah digunakan.";
                    usernameErr.style.display = 'block';
                    return;
                }

                // Check duplicate email
                const duplicateEmail = users.find(u => u.email.toLowerCase() === emailValue.toLowerCase());
                if (duplicateEmail) {
                    emailInput.classList.add('is-invalid');
                    emailErr.textContent = "Email ini sudah terdaftar.";
                    emailErr.style.display = 'block';
                    return;
                }

                // Save new user
                users.push({
                    username: usernameValue,
                    email: emailValue,
                    password: passwordValue
                });
                localStorage.setItem('users', JSON.stringify(users));

                // Success
                successAlert.textContent = "Registrasi berhasil! Mengarahkan ke halaman login...";
                successAlert.style.display = 'block';
                registerForm.reset();

                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 2000);
            });

            function validateEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }
        });
    </script>
</body>
</html>
