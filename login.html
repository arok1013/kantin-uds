<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pujasera UDS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f7f9fc;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #4E54C8;
            padding: 15px 50px;
            color: white;
            box-shadow: 0 4px 15px rgba(78, 84, 200, 0.2);
        }

        .navbar-logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .navbar-menu {
            display: flex;
            gap: 20px;
        }

        .navbar-menu a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .navbar-menu a:hover {
            color: #FFD166;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .container.form-container {
            max-width: 450px;
            margin: 80px auto;
            padding: 35px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .form-title {
            text-align: center;
            margin-bottom: 30px;
            color: #4E54C8;
            font-size: 28px;
            position: relative;
            padding-bottom: 10px;
        }

        .form-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #4E54C8, #8F94FB);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #4E54C8;
            box-shadow: 0 0 0 3px rgba(78, 84, 200, 0.2);
            outline: none;
        }

        .invalid-feedback {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .is-invalid {
            border-color: #e74c3c;
        }

        .btn {
            display: inline-block;
            background-color: #4E54C8;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(78, 84, 200, 0.3);
        }

        .btn:hover {
            background-color: #3A40AB;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(78, 84, 200, 0.4);
        }

        .btn-back {
            display: inline-block;
            background-color: #6c757d;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.3);
            text-align: center;
        }

        .btn-back:hover {
            background-color: #5a6268;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(108, 117, 125, 0.4);
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .register-link a {
            color: #4E54C8;
            text-decoration: none;
            font-weight: 500;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: 500;
            display: none;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        footer {
            background-color: #2D3047;
            color: white;
            text-align: center;
            padding: 30px;
            margin-top: 50px;
            width: 100%;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }
            
            .container.form-container {
                margin: 50px 15px;
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-logo">Pujasera UDS</div>
        <div class="navbar-menu">
            <a href="index.html">Beranda</a>
            <a href="register.html">Register</a>
        </div>
    </nav>
    
    <div class="container form-container">
        <h2 class="form-title">Login</h2>
        
        <div class="alert alert-danger" id="login-alert"></div>

        <form id="login-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" class="form-control" placeholder="Masukkan username">
                <span class="invalid-feedback" id="username-err">Silakan masukkan username.</span>
            </div>    
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" placeholder="Masukkan password">
                <span class="invalid-feedback" id="password-err">Silakan masukkan password.</span>
            </div>
            <div class="form-group">
                <button type="submit" class="btn">Login</button>
            </div>
            <p class="register-link">Belum punya akun? <a href="register.html">Daftar disini</a>.</p>
        </form>
        <a href="index.html" class="btn-back">
            <i class="fas fa-arrow-left"></i> Kembali ke Beranda
        </a>
    </div>
    
    <footer>
        <p>&copy; 2025 Derik. Hak Cipta Dilindungi.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if already logged in
            if (localStorage.getItem('loggedin') === 'true') {
                window.location.href = 'index.html';
                return;
            }

            const loginForm = document.getElementById('login-form');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const usernameErr = document.getElementById('username-err');
            const passwordErr = document.getElementById('password-err');
            const loginAlert = document.getElementById('login-alert');

            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Reset states
                usernameInput.classList.remove('is-invalid');
                passwordInput.classList.remove('is-invalid');
                usernameErr.style.display = 'none';
                passwordErr.style.display = 'none';
                loginAlert.style.display = 'none';

                const usernameValue = usernameInput.value.trim();
                const passwordValue = passwordInput.value.trim();
                let hasError = false;

                if (!usernameValue) {
                    usernameInput.classList.add('is-invalid');
                    usernameErr.style.display = 'block';
                    hasError = true;
                }

                if (!passwordValue) {
                    passwordInput.classList.add('is-invalid');
                    passwordErr.style.display = 'block';
                    hasError = true;
                }

                if (hasError) return;

                // Load users from localStorage
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                
                // Find matching user
                // (Checking case-insensitive username for convenience, or case-sensitive as PHP)
                const user = users.find(u => u.username.toLowerCase() === usernameValue.toLowerCase());

                if (user && user.password === passwordValue) {
                    // Successful login
                    localStorage.setItem('loggedin', 'true');
                    localStorage.setItem('username', user.username);
                    window.location.href = 'index.html';
                } else {
                    // Check if it's default admin for easier testing/fallback
                    if (usernameValue === "admin" && passwordValue === "admin123") {
                        localStorage.setItem('loggedin', 'true');
                        localStorage.setItem('username', 'Admin');
                        window.location.href = 'index.html';
                        return;
                    }
                    
                    // Failed login
                    loginAlert.textContent = "Username atau password tidak valid.";
                    loginAlert.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
